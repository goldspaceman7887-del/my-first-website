name: Spanish tutor tests

# Runs the regression suite on every change to the Spanish tutor. The app has
# no build step, so nothing else would catch a broken deploy before the users
# do — and one past bug silently discarded every learner's spaced-repetition
# progress on page load.

on:
  push:
    paths:
      - "mexican-spanish-tutor/**"
      - ".github/workflows/test-spanish.yml"
  pull_request:
    paths:
      - "mexican-spanish-tutor/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mexican-spanish-tutor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Syntax-check every module
        run: |
          set -e
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check service-worker.js
          echo "all modules parse"

      - name: Check the service worker precaches every module
        run: |
          set -e
          missing=0
          for f in $(find js -name '*.js' | sort); do
            grep -q "\"$f\"" service-worker.js || { echo "::error::$f is not in the service worker precache list — it will be unavailable offline"; missing=1; }
          done
          [ "$missing" = "0" ] && echo "every module is precached"

      - name: Regression suite
        run: npm test
