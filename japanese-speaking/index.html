<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>上級への道 — Advanced High Speaking Lab</title>
<meta name="description" content="A focused speaking-practice app to take your Japanese from ACTFL Intermediate High to Advanced High, with an emphasis on connecting sentences into paragraphs." />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<a class="skip-link" href="#view-root">Skip to content</a>

<div class="app-shell">
  <header class="topbar">
    <button class="icon-btn nav-toggle" id="nav-toggle" aria-label="Open menu" aria-expanded="false">
      <span class="hamburger"></span>
    </button>
    <a href="#/dashboard" class="brand" data-nav-link>
      <span class="brand-flag" aria-hidden="true">🎤</span>
      <span class="brand-name">上級への道</span>
    </a>

    <div class="topbar-stats" aria-label="Your progress">
      <div class="stat-chip" title="Day streak">
        <span aria-hidden="true">🔥</span><span id="stat-streak">0</span>
      </div>
      <div class="stat-chip" title="Experience (XP)">
        <span aria-hidden="true">⚡</span><span id="stat-xp">0</span>
      </div>
    </div>

    <div class="topbar-actions">
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle light/dark theme">
        <span id="theme-icon" aria-hidden="true">🌙</span>
      </button>
    </div>
  </header>

  <div class="app-body">
    <nav class="sidebar" id="sidebar" aria-label="Main navigation">
      <ul class="nav-list">
        <li><a href="#/dashboard" data-nav-link><span class="nav-icon">🏠</span><span class="nav-text">Dashboard</span></a></li>
        <li><a href="#/review" data-nav-link><span class="nav-icon">⚡</span><span class="nav-text">Review</span></a></li>
        <li><a href="#/guide" data-nav-link><span class="nav-icon">🧭</span><span class="nav-text">Guide</span></a></li>
        <li><a href="#/connectors" data-nav-link><span class="nav-icon">🔗</span><span class="nav-text">Connector Lab</span></a></li>
        <li><a href="#/grammar" data-nav-link><span class="nav-icon">📚</span><span class="nav-text">Grammar Ladder</span></a></li>
        <li><a href="#/vocabulary" data-nav-link><span class="nav-icon">🈶</span><span class="nav-text">Vocabulary (N3→N2)</span></a></li>
        <li><a href="#/levels" data-nav-link><span class="nav-icon">🪜</span><span class="nav-text">Level Ladder</span></a></li>
        <li><a href="#/practice" data-nav-link><span class="nav-icon">🎤</span><span class="nav-text">Paragraph Practice</span></a></li>
        <li><a href="#/shadowing" data-nav-link><span class="nav-icon">🔁</span><span class="nav-text">Shadowing</span></a></li>
        <li><a href="#/roadmap" data-nav-link><span class="nav-icon">📅</span><span class="nav-text">12-Week Roadmap</span></a></li>
        <li><a href="#/rubric" data-nav-link><span class="nav-icon">📋</span><span class="nav-text">Self-Assessment</span></a></li>
        <li><a href="#/settings" data-nav-link><span class="nav-icon">⚙️</span><span class="nav-text">Settings</span></a></li>
      </ul>
    </nav>
    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <main id="view-root" class="view-root" tabindex="-1"></main>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
